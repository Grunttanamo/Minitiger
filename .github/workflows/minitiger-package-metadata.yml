name: Update Minitiger Package Metadata

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Text shown below the minitiger-web package name (max 512 characters)'
        required: true
        type: string
        default: 'Minitiger Web is a custom Jellyfin 12.1 frontend delivered as a safe sidecar. Keep your existing Jellyfin server, database, users, libraries, watch state and settings untouched while using the Minitiger interface in a separate container.'

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    name: Update GHCR metadata only
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/grunttanamo/minitiger-web
      DESCRIPTION: ${{ inputs.description }}

    steps:
      - name: Validate description
        shell: bash
        run: |
          set -euo pipefail
          length=$(printf '%s' "$DESCRIPTION" | wc -m)
          if [ "$length" -gt 512 ]; then
            echo "Description is $length characters; GHCR allows at most 512."
            exit 1
          fi
          echo "Description length: $length / 512"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag existing multi-arch index with updated metadata
        shell: bash
        run: |
          set -euo pipefail

          digest=$(docker buildx imagetools inspect "$IMAGE:latest" \
            | awk '/^Digest:/ {print $2; exit}')

          if [ -z "$digest" ]; then
            echo "Could not resolve the current latest digest."
            exit 1
          fi

          echo "Reusing existing image index: $IMAGE@$digest"

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=Minitiger Web" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=https://github.com/Grunttanamo/Minitiger" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-or-later" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:12.1" \
            "$IMAGE@$digest"

      - name: Show resulting index
        shell: bash
        run: docker buildx imagetools inspect "$IMAGE:latest"
