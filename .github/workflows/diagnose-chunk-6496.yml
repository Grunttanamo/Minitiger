name: Diagnose Minitiger chunk 6496

on:
  push:
    branches:
      - diagnose/runtime-map-chunk-6496
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build production frontend
        env:
          JELLYFIN_VERSION: '12.1'
        run: npm run build:production

      - name: Locate chunk 6496
        shell: bash
        run: |
          set -euxo pipefail
          find dist -maxdepth 1 -type f -name '6496*' -print
          test -n "$(find dist -maxdepth 1 -type f -name '6496*' -print -quit)"

      - name: Upload chunk 6496
        uses: actions/upload-artifact@v4
        with:
          name: minitiger-chunk-6496
          path: dist/6496*
          if-no-files-found: error
          retention-days: 1
