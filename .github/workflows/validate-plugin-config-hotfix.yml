name: Validate plugin configuration page hotfix

on:
  push:
    branches:
      - fix/plugin-config-pages-array-guard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type check
        run: npm run build:check

      - name: Production build
        env:
          JELLYFIN_VERSION: '12.1'
        run: npm run build:production
